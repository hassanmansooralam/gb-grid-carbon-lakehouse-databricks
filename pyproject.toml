[project]
name = "carbon-lakehouse"
version = "0.1.0"
description = "GB Grid Carbon Lakehouse - Databricks portfolio project"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pyyaml>=6.0"]

[project.optional-dependencies]
extract = ["databricks-sdk>=0.30"]
dev = ["pytest>=8", "pyspark==4.0.1", "pandas>=2.0", "numpy>=1.26", "scikit-learn>=1.4", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["carbon_lakehouse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]
